name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package: [system_one_contracts, system_one_sdk, system_one_server]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}

    steps:
      - name: Checkout SystemOneSDK
        uses: actions/checkout@v4

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.4'
          otp-version: '29.0'

      - name: Cache Mix dependencies and Dialyzer PLTs
        uses: actions/cache@v4
        with:
          path: |
            packages/${{ matrix.package }}/deps
            packages/${{ matrix.package }}/_build
          key: ${{ runner.os }}-beam-1.20.4-29.0-${{ matrix.package }}-${{ hashFiles(format('packages/{0}/mix.lock', matrix.package), format('packages/{0}/mix.exs', matrix.package)) }}
          restore-keys: |
            ${{ runner.os }}-beam-1.20.4-29.0-${{ matrix.package }}-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Format
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Test
        env:
          MIX_ENV: test
        run: |
          mix compile --warnings-as-errors
          mix test --warnings-as-errors

      - name: Credo
        if: matrix.package == 'system_one_contracts' || matrix.package == 'system_one_sdk'
        run: mix credo --strict

      - name: Dialyzer
        if: matrix.package == 'system_one_contracts' || matrix.package == 'system_one_sdk'
        run: mix dialyzer

      - name: Docs
        run: mix docs --warnings-as-errors

      - name: Hex package
        if: matrix.package == 'system_one_contracts' || matrix.package == 'system_one_sdk'
        run: ../../scripts/release_check ${{ matrix.package }}

  bumblebee-format:
    name: system_one_bumblebee (format)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/system_one_bumblebee

    steps:
      - name: Checkout SystemOneSDK
        uses: actions/checkout@v4

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.4'
          otp-version: '29.0'

      - name: Format
        run: mix format --check-formatted

      - name: Note external Phase B/C path dependencies
        run: |
          echo "system_one_bumblebee compile/test skipped in standalone CI until hf_hub and crucible_safetensors path dependencies move to Hex."
