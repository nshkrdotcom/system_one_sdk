name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SystemOneSDK
        uses: actions/checkout@v4

      - name: Checkout TypeSafeAPISDK
        uses: actions/checkout@v4
        with:
          repository: nshkrdotcom/typesafe_api_sdk
          path: .tooling/typesafe_api_sdk

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.4'
          otp-version: '29.0'

      - name: Configure local provider dependency
        shell: bash
        run: |
          echo "TYPESAFE_API_SDK_PATH=$GITHUB_WORKSPACE/.tooling/typesafe_api_sdk" >> "$GITHUB_ENV"
          echo "MIX_WORKSPACE_OPS_BOOTSTRAP=$GITHUB_WORKSPACE/scripts/local_workspace.exs" >> "$GITHUB_ENV"

      - name: Fetch dependencies
        run: mix deps.get

      - name: Format
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Test
        run: mix test --warnings-as-errors

      - name: Credo
        run: mix credo --strict

      - name: Dialyzer
        run: mix dialyzer

      - name: Docs
        run: mix docs --warnings-as-errors

      - name: Hex package
        shell: bash
        run: |
          unset MIX_WORKSPACE_OPS_BOOTSTRAP
          unset TYPESAFE_API_SDK_PATH
          mix hex.build
