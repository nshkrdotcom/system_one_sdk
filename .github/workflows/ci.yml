name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [system_one_sdk, system_one_bumblebee, system_one_server]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}

    steps:
      - name: Checkout SystemOneSDK
        uses: actions/checkout@v4

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.4'
          otp-version: '29.0'

      - name: Fetch dependencies
        run: mix deps.get

      - name: Format
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Test
        run: mix test --warnings-as-errors

      - name: Credo
        if: matrix.package == 'system_one_sdk'
        run: mix credo --strict

      - name: Dialyzer
        if: matrix.package == 'system_one_sdk'
        run: mix dialyzer

      - name: Docs
        run: mix docs --warnings-as-errors

      - name: Hex package
        if: matrix.package == 'system_one_sdk'
        run: ../../scripts/release_check system_one_sdk
