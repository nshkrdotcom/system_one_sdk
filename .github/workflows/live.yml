name: Live TypeSafe Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SystemOneSDK
        uses: actions/checkout@v4

      - name: Checkout TypeSafeAPISDK
        uses: actions/checkout@v4
        with:
          repository: nshkrdotcom/typesafe_api_sdk
          path: .tooling/typesafe_api_sdk

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.4'
          otp-version: '29.0'

      - name: Configure local provider dependency
        shell: bash
        run: |
          echo "TYPESAFE_API_SDK_PATH=$GITHUB_WORKSPACE/.tooling/typesafe_api_sdk" >> "$GITHUB_ENV"
          echo "MIX_WORKSPACE_OPS_BOOTSTRAP=$GITHUB_WORKSPACE/scripts/local_workspace.exs" >> "$GITHUB_ENV"

      - name: Fetch dependencies
        run: mix deps.get

      - name: Run live tests
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          TYPESAFE_BASE_URL: ${{ vars.TYPESAFE_BASE_URL }}
          TYPESAFE_DEFAULT_MODEL: ${{ vars.TYPESAFE_DEFAULT_MODEL }}
        run: mix test --include live
